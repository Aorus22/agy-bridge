<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agy</title>
<style>
  :root {
    --bg: #1e1e1e;
    --bg-panel: #252526;
    --bg-hover: #2a2d2e;
    --bg-active: #04395e;
    --bg-code: #1a1a1a;
    --border: #3c3c3c;
    --border-soft: #2d2d2d;
    --text: #cccccc;
    --text-dim: #858585;
    --text-faint: #6e6e6e;
    --green: #63984f;
    --red: #de5555;
    --blue: #6a9fcb;
    --purple: #c084fc;
    --amber: #e0712f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* layout */
  .app { display: flex; height: 100vh; }
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 10px 14px 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border-soft);
  }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .project-group { margin-bottom: 4px; }
  .project-header {
    padding: 6px 14px 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .project-header:hover { color: var(--text); }
  .project-header .chevron { font-size: 9px; width: 10px; }
  .project-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-count { color: var(--text-faint); font-size: 10px; }
  .session-item {
    padding: 5px 14px 5px 28px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 2px solid transparent;
  }
  .session-item:hover { background: var(--bg-hover); color: var(--text); }
  .session-item.active { background: var(--bg-active); color: var(--text); border-left-color: var(--blue); }
  .session-status { font-size: 12px; width: 14px; text-align: center; flex-shrink: 0; }
  .session-id { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; font-size: 11px; }
  .session-time { color: var(--text-faint); font-size: 10px; flex-shrink: 0; }

  .pulse-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--blue);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }

  /* main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-panel);
  }
  .main-header .conv-id { font-family: ui-monospace, monospace; color: var(--text); }
  .main-header .meta { display: flex; gap: 14px; margin-left: auto; }
  .main-header .meta span { color: var(--text-faint); }
  .main-header .meta b { color: var(--text-dim); font-weight: 500; }
  .main-body { flex: 1; overflow-y: auto; padding: 12px 0; }

  .empty-main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); font-size: 13px;
  }

  /* transcript steps */
  .step { padding: 3px 16px 3px 20px; position: relative; }
  .step::before {
    content: ""; position: absolute; left: 8px; top: 0; bottom: 0;
    width: 2px; background: var(--border-soft);
  }
  .step.tool::before { background: var(--blue); }
  .step.thinking::before { background: var(--purple); }
  .step.response::before { background: var(--green); }
  .step.user::before { background: var(--text-faint); }
  .step:first-child::before { top: 6px; }
  .step:last-child::before { bottom: auto; height: 6px; }

  .step-row { display: flex; align-items: baseline; gap: 8px; min-height: 20px; }
  .step-ico { position: absolute; left: 3px; top: 3px; font-size: 11px; width: 12px; text-align: center; z-index: 1; background: var(--bg); }
  .step-label { font-weight: 500; white-space: nowrap; }
  .step-label.tool { color: var(--blue); }
  .step-label.thinking { color: var(--purple); }
  .step-label.response { color: var(--green); }
  .step-label.user { color: var(--text-dim); }
  .step-time { margin-left: auto; color: var(--text-faint); font-family: monospace; font-size: 10px; white-space: nowrap; }

  .step-detail { padding-left: 0; margin-top: 2px; font-size: 12px; }
  .step-detail .params { color: var(--text-dim); font-family: monospace; font-size: 11px; }
  .step-detail .params .k { color: var(--text-faint); }
  .step-detail .params .v { color: var(--text); }
  .step-detail .out { color: var(--green); font-family: monospace; font-size: 11px; }
  .step-detail .err { color: var(--red); font-family: monospace; font-size: 11px; }
  .step-text { color: var(--text); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .step-text code { background: var(--bg-code); padding: 1px 4px; border-radius: 3px; font-size: 11px; font-family: monospace; }
  .step-text pre { background: var(--bg-code); padding: 8px; border-radius: 4px; overflow-x: auto; margin: 4px 0; font-size: 11px; font-family: monospace; border: 1px solid var(--border-soft); }
  .step-text a { color: var(--blue); text-decoration: none; }
  .step-text strong { font-weight: 600; }

  /* result */
  .result { margin: 8px 16px 12px; padding-top: 8px; border-top: 1px solid var(--border-soft); }
  .result-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .result-mark { font-size: 13px; }
  .result-mark.ok { color: var(--green); }
  .result-mark.err { color: var(--red); }
  .result-label { color: var(--text-dim); }
  .result-meta { margin-left: auto; color: var(--text-faint); font-family: monospace; font-size: 11px; }
  .tokens { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 10px; font-family: monospace; font-size: 10px; color: var(--text-faint); }
  .tokens b { color: var(--text-dim); font-weight: 500; }
  .final-response {
    margin-top: 6px; padding: 8px 10px; background: var(--bg-code);
    border-radius: 4px; border: 1px solid var(--border-soft);
    font-size: 12px; white-space: pre-wrap; word-break: break-word;
    max-height: 300px; overflow-y: auto;
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">Antigravity · Sessions</div>
    <div class="sidebar-list" id="list"></div>
  </div>
  <div class="main">
    <div class="main-header" id="header" style="display:none">
      <span class="conv-id" id="h-conv"></span>
      <div class="meta">
        <span id="h-cwd"></span>
        <span id="h-tools"></span>
        <span id="h-time"></span>
      </div>
    </div>
    <div class="main-body" id="body">
      <div class="empty-main">Select a session</div>
    </div>
  </div>
</div>
<script>
const es = new EventSource("/events");
const runs = new Map();
let selectedFile = null;
let collapsedProjects = new Set();

es.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === "ready") return;
  if (msg.file && msg.lines) {
    let run = runs.get(msg.file);
    if (!run) { run = makeRun(msg.file); runs.set(msg.file, run); }
    for (const line of msg.lines) { try { handle(run, JSON.parse(line)); } catch {} }
    if (run.status === "running" && !selectedFile) selectedFile = msg.file;
    renderSidebar();
    if (selectedFile === msg.file) renderMain();
  }
};

function makeRun(f) {
  return { file: f, convId: null, cwd: null, toolCount: 0, perm: null, status: "running", start: Date.now(), steps: new Map(), result: null };
}
function handle(r, e) {
  if (e.event === "init") {
    if (e.conversation_id) r.convId = e.conversation_id;
    if (e.init) { r.cwd = e.init.cwd; r.toolCount = e.init.tools ? e.init.tools.length : 0; r.perm = e.init.permission_mode; }
  } else if (e.event === "step_update" && e.step_update) {
    const s = e.step_update, i = s.step_index ?? r.steps.size;
    let st = r.steps.get(i) || { i, type: "step", state: "", text: "", tool: "", params: null, out: null, err: null, dur: null, think: 0, usage: null };
    if (s.step_type) st.type = s.step_type;
    if (s.state) st.state = s.state;
    if (s.tool_name) st.tool = s.tool_name;
    if (s.tool_info) { if (s.tool_info.name) st.tool = s.tool_info.name; if (s.tool_info.parameters) st.params = s.tool_info.parameters; if (s.tool_info.output) st.out = s.tool_info.output; if (s.tool_info.error) st.err = s.tool_info.error.message; }
    if (s.text_delta) st.text += s.text_delta;
    if (s.duration_seconds != null) st.dur = s.duration_seconds;
    if (s.usage) { st.usage = s.usage; st.think = s.usage.thinking_tokens || 0; }
    r.steps.set(i, st);
  } else if (e.event === "result" && e.result) {
    r.result = e.result;
    r.status = e.result.status === "SUCCESS" ? "done" : "error";
  }
}

function esc(s) { return (s||"").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">"); }
function dur(s) { if (s==null) return ""; return s<1?s.toFixed(2)+"s":s<60?(Math.round(s*10)/10)+"s":Math.floor(s/60)+"m"+Math.round(s%60)+"s"; }
function tok(u) { if (!u) return ""; const p=[]; if(u.input_tokens)p.push("▲ <b>"+u.input_tokens.toLocaleString()+"</b>"); if(u.output_tokens)p.push("▼ <b>"+u.output_tokens.toLocaleString()+"</b>"); if(u.thinking_tokens)p.push("✦ <b>"+u.thinking_tokens.toLocaleString()+"</b>"); if(u.cache_read_tokens)p.push("♻ <b>"+u.cache_read_tokens.toLocaleString()+"</b>"); if(u.total_tokens)p.push("= <b>"+u.total_tokens.toLocaleString()+"</b>"); return p.join("  "); }
function params(p) { if (!p) return ""; return Object.entries(p).map(([k,v])=>{let val=typeof v==="string"?v:(v==null?"null":JSON.stringify(v)); if(val.length>120)val=val.slice(0,120)+"…"; return `<span class="k">${esc(k)}:</span> <span class="v">${esc(val)}</span>`}).join("  ·  "); }
function md(t) { let h=esc(t); h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>`<pre>${c.replace(/\n$/,"")}</pre>`); h=h.replace(/`([^`]+)`/g,"<code>$1</code>"); h=h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>"); h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>'); return h; }

function escAttr(s) { return (s||"").replace(/'/g, "\\'"); }
function projName(r) { return r.cwd || "unknown"; }
function relTime(r) { if (r.result && r.result.duration_seconds!=null) return dur(r.result.duration_seconds); if (r.status==="running") return Math.round((Date.now()-r.start)/1000)+"s"; return ""; }

function renderSidebar() {
  const list = document.getElementById("list");
  // group by project
  const groups = new Map();
  for (const r of runs.values()) {
    const p = projName(r);
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(r);
  }
  let html = "";
  for (const [proj, rs] of groups) {
    const collapsed = collapsedProjects.has(proj);
    const name = proj.split("/").pop() || proj;
    html += `<div class="project-group">`;
    html += `<div class="project-header" onclick="toggleProject('${escAttr(proj)}')"><span class="chevron">${collapsed?"▶":"▼"}</span><span class="project-name" title="${esc(proj)}">${esc(name)}</span><span class="project-count">${rs.length}</span></div>`;
    if (!collapsed) {
      rs.sort((a,b)=>b.start-a.start);
      for (const r of rs) {
        const active = r.file === selectedFile;
        const ico = r.status==="done"?'<span style="color:var(--green)">✓</span>':r.status==="error"?'<span style="color:var(--red)">✗</span>':'<span class="pulse-dot"></span>';
        html += `<div class="session-item ${active?"active":""}" onclick="selectRun('${escAttr(r.file)}')"><span class="session-status">${ico}</span><span class="session-id">${esc(r.convId?r.convId.slice(0,8):r.file.split("/").pop())}</span><span class="session-time">${relTime(r)}</span></div>`;
      }
    }
    html += `</div>`;
  }
  if (runs.size === 0) html = `<div style="padding:24px 14px;color:var(--text-faint);font-size:12px">No sessions yet</div>`;
  list.innerHTML = html;
}

window.toggleProject = (p) => { if (collapsedProjects.has(p)) collapsedProjects.delete(p); else collapsedProjects.add(p); renderSidebar(); };
window.selectRun = (f) => { selectedFile = f; renderSidebar(); renderMain(); };

function renderMain() {
  const r = runs.get(selectedFile);
  const hdr = document.getElementById("header");
  const body = document.getElementById("body");
  if (!r) { hdr.style.display="none"; body.innerHTML='<div class="empty-main">Select a session</div>'; return; }
  hdr.style.display = "flex";
  document.getElementById("h-conv").textContent = r.convId ? r.convId.slice(0,12) : (r.file.split("/").pop());
  document.getElementById("h-cwd").innerHTML = r.cwd ? `<b>cwd</b> ${esc(r.cwd)}` : "";
  document.getElementById("h-tools").innerHTML = r.toolCount ? `<b>tools</b> ${r.toolCount}` : "";
  document.getElementById("h-time").innerHTML = `<b>${relTime(r)}</b>`;

  let html = "";
  const steps = [...r.steps.values()].sort((a,b)=>a.i-b.i);
  for (const s of steps) html += renderStep(s);
  if (r.result) {
    const res = r.result, ok = res.status === "SUCCESS";
    html += `<div class="result"><div class="result-row"><span class="result-mark ${ok?"ok":"err"}">${ok?"✓":"✗"}</span><span class="result-label">${esc(res.status||"done")}</span><span class="result-meta">${dur(res.duration_seconds)} · ${res.num_turns||0} turn${res.num_turns===1?"":"s"}</span></div>`;
    if (res.usage) html += `<div class="tokens">${tok(res.usage)}</div>`;
    if (res.error) html += `<div class="step-detail"><span class="err">✗ ${esc(res.error)}</span></div>`;
    if (res.response && res.response.trim()) html += `<div class="final-response">${md(res.response.trim())}</div>`;
    html += `</div>`;
  }
  body.innerHTML = html || '<div class="empty-main">Waiting for events…</div>';
}

function renderStep(s) {
  const cls = s.type==="tool"?"tool":s.type==="agent_response"?(s.text.trim()?"response":"thinking"):"user";
  const ico = s.type==="user_input"?"📨":s.type==="agent_response"?(s.text.trim()?"🤖":"⟡"):"🔧";
  const si = s.state==="ACTIVE"?'<span class="pulse-dot"></span>':s.state==="DONE"?"✓":s.state==="ERROR"?"✗":"▸";
  let h = `<div class="step ${cls}"><span class="step-ico">${ico}</span><div class="step-row">`;
  if (s.type === "user_input") h += `<span class="step-label user">prompt received</span>`;
  else if (s.type === "agent_response" && !s.text.trim()) h += `<span class="step-label thinking">thinking</span><span class="step-time">${s.think?s.think.toLocaleString()+" tokens · ":""}${dur(s.dur)}</span>`;
  else if (s.type === "agent_response") h += `<span class="step-label response">response</span><span class="step-time">${dur(s.dur)}</span>`;
  else if (s.type === "tool") { const sc = s.state==="ERROR"?"var(--red)":s.state==="DONE"?"var(--green)":"var(--text-faint)"; h += `<span class="step-label tool">${esc(s.tool||"tool")}</span><span class="step-time" style="color:${sc}">${si} ${dur(s.dur)}</span>`; }
  else h += `<span class="step-label">step ${s.i+1}</span>`;
  h += `</div>`;
  if (s.type === "agent_response" && s.text.trim()) h += `<div class="step-text">${md(s.text.trim())}</div>`;
  if (s.type === "tool") { if (s.params) h += `<div class="step-detail"><div class="params">${params(s.params)}</div></div>`; if (s.out) h += `<div class="step-detail"><span class="out">→ ${esc(s.out).slice(0,200)}</span></div>`; if (s.err) h += `<div class="step-detail"><span class="err">✗ ${esc(s.err)}</span></div>`; }
  h += `</div>`;
  return h;
}

// live timer
setInterval(() => { let n=false; for (const r of runs.values()) if (r.status==="running") n=true; if (n) { renderSidebar(); if (selectedFile) renderMain(); } }, 1000);
es.onerror = () => { document.getElementById("body").innerHTML = '<div class="empty-main">Connection lost</div>'; };
</script>
</body>
</html>
